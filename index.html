<!DOCTYPE html>
<html lang="id" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mushaf Al-Qur'an Standar Indonesia (LPMQ Kemenag RI & Quran.com)</title>
  <meta name="description" content="Aplikasi Al-Qur'an Web resmi berstandar Mushaf Indonesia 15 Baris (LPMQ Kemenag RI) dengan tampilan persis cetakan aslinya, audio murottal kata demi kata, dan terjemahan resmi Kemenag RI." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" href="./favicon.ico" />

  <!-- Standalone Production CSS (Zero Warnings) -->
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/mushaf.css" />

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-scale-in { animation: scaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-primary)] transition-colors antialiased select-none selection:bg-amber-200">

  <!-- Loading Indicator Overlay -->
  <div id="loading-indicator" class="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center pointer-events-none transition-opacity" style="display: none;">
    <div class="p-4 bg-white dark:bg-stone-900 rounded-2xl shadow-2xl border border-stone-200 dark:border-stone-800 flex items-center gap-3">
      <div class="w-6 h-6 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-xs font-bold text-stone-700 dark:text-stone-300">Memuat Halaman Mushaf...</span>
    </div>
  </div>

  <!-- Main React/JS App Root -->
  <div id="app"></div>

  <!-- App Entry Script -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
