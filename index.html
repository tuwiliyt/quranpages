<!DOCTYPE html>
<html lang="id" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mushaf Al-Qur'an Standar Indonesia (LPMQ Kemenag RI & Quran.com)</title>
  <meta name="description" content="Aplikasi Al-Qur'an Web resmi berstandar Mushaf Indonesia 15 Baris (LPMQ Kemenag RI) dengan tampilan persis cetakan aslinya, audio murottal sinkronisasi kata kata demi kata, dan 100% aset lokal offline." />
  
  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#105652" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./favicon.svg" />

  <!-- 100% Standalone Offline CSS -->
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/mushaf.css" />

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.05); }
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-scale-in { animation: scaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-primary)] transition-colors antialiased select-none selection:bg-amber-200">

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; transition: opacity 1s ease-in-out;">
    <!-- Glowing background effect -->
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0.2; pointer-events: none;">
      <div style="width: 18rem; height: 18rem; background-color: #10b981; border-radius: 9999px; filter: blur(100px); animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
    </div>
    
    <!-- Calligraphy Centerpiece -->
    <div style="z-index: 10; display: flex; flex-direction: column; align-items: center; animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
      <h1 class="font-arabic" style="font-size: clamp(4rem, 10vw, 6rem); font-weight: bold; color: #fbbf24; text-shadow: 0 4px 6px rgba(0,0,0,0.5); margin-bottom: 0.5rem; line-height: 1.5;">
        القرآن الكريم
      </h1>
      <h2 style="color: #a8a29e; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; font-size: clamp(0.75rem, 3vw, 0.875rem); margin-top: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
        <span style="width: 2rem; height: 1px; background-color: #44403c;"></span>
        Mushaf Digital
        <span style="width: 2rem; height: 1px; background-color: #44403c;"></span>
      </h2>
      <h3 style="color: #78716c; font-weight: 500; font-size: clamp(0.65rem, 2.5vw, 0.75rem); margin-top: 0.5rem; text-align: center; letter-spacing: 0.05em;">
        Terjemahan Indonesia & Bahasa Gorontalo
      </h3>
    </div>

    <!-- Footer Credits -->
    <div style="position: absolute; bottom: 2rem; z-index: 10; text-align: center; font-size: 0.75rem; font-weight: 500; color: #78716c; animation: fadeIn 1s ease-out 0.5s both;">
      <p>by <span style="color: #f59e0b; font-weight: bold; letter-spacing: 0.05em;">@richieoct</span> dan <span style="color: #f59e0b; font-weight: bold; letter-spacing: 0.05em;">Panita Project</span></p>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app"></div>

  <!-- App Entry Script -->
  <script type="module" src="./js/app.js"></script>

  <!-- PWA Offline Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
