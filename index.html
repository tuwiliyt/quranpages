<!DOCTYPE html>
<html lang="id" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mushaf Al-Qur'an Standar Indonesia (LPMQ Kemenag RI & Quran.com)</title>
  <meta name="description" content="Aplikasi Al-Qur'an Web resmi berstandar Mushaf Indonesia 15 Baris (LPMQ Kemenag RI) dengan tampilan persis cetakan aslinya, audio murottal sinkronisasi kata kata demi kata, dan 100% aset lokal offline." />
  
  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#105652" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./favicon.svg" />

  <!-- 100% Standalone Offline CSS -->
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/mushaf.css" />

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-scale-in { animation: scaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-primary)] transition-colors antialiased select-none selection:bg-amber-200">

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-stone-50 dark:bg-stone-950 transition-opacity duration-1000 ease-in-out">
    <!-- Glowing background effect -->
    <div class="absolute inset-0 flex items-center justify-center opacity-40 dark:opacity-20 pointer-events-none">
      <div class="w-72 h-72 bg-emerald-500 rounded-full blur-[120px] animate-pulse"></div>
    </div>
    
    <!-- Calligraphy Centerpiece -->
    <div class="z-10 flex flex-col items-center" style="animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
      <h1 class="font-arabic text-6xl md:text-8xl font-bold text-emerald-800 dark:text-amber-400 drop-shadow-md mb-2" style="line-height: 1.5;">
        القرآن الكريم
      </h1>
      <h2 class="text-stone-500 dark:text-stone-400 font-semibold tracking-[0.3em] uppercase text-xs md:text-sm mt-3 flex items-center gap-2">
        <span class="w-8 h-[1px] bg-emerald-300 dark:bg-stone-700"></span>
        Mushaf Digital
        <span class="w-8 h-[1px] bg-emerald-300 dark:bg-stone-700"></span>
      </h2>
    </div>

    <!-- Footer Credits -->
    <div class="absolute bottom-8 z-10 text-center text-[11px] md:text-xs font-medium text-stone-400 dark:text-stone-500" style="animation: fadeIn 1s ease-out 0.5s both;">
      <p>by <span class="text-emerald-700 dark:text-amber-500 font-bold tracking-wide">@richieoct</span> dan <span class="text-emerald-700 dark:text-amber-500 font-bold tracking-wide">Panita Project</span></p>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app"></div>

  <!-- App Entry Script -->
  <script type="module" src="./js/app.js"></script>

  <!-- PWA Offline Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
